name: Check publicity publisher

on:
  pull_request:
    paths:
      - 'publicity/**'
      - '.github/workflows/*publicity*.yml'
  push:
    branches: [main]
    paths:
      - 'publicity/**'
      - '.github/workflows/*publicity*.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s publicity/tests -v
