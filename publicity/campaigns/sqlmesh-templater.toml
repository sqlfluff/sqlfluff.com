[copy]
bluesky = """
SQLFluff's SQLMesh templater is now on PyPI. Our worked example uses a local DuckDB project to lint and fix model SQL containing a SQLMesh macro, with no warehouse credentials needed.

Setup and coverage limits:
https://sqlfluff.com/updates/sqlmesh-templater/
"""

linkedin = """
The SQLMesh templater for SQLFluff is now available on PyPI as sqlfluff-templater-sqlmesh. Plugin 4.5.0 installs the matching SQLFluff 4.5.0 package.

The article walks through a small DuckDB project: configure SQLMesh and SQLFluff, add a model using @VAR, then lint and fix its keyword casing. The example runs locally without warehouse credentials, an existing dataset or a SQLMesh plan.

It also explains where coverage is limited. More complex rendering can fall back to a coarse source mapping, with violations in templated regions suppressed by default. A clean result doesn't necessarily mean every part of a heavily templated model was checked.

The complete example and setup instructions are here:
https://sqlfluff.com/updates/sqlmesh-templater/
"""

slack = """
The SQLMesh templater is available on PyPI: sqlfluff-templater-sqlmesh. Plugin 4.5.0 installs SQLFluff 4.5.0.

We've written a worked example using DuckDB and a SQLMesh @VAR macro. It takes you through configuration, the original lint diagnostics, fixes and a clean lint run, without warehouse credentials or a SQLMesh plan:
https://sqlfluff.com/updates/sqlmesh-templater/

The post also covers source-mapping limitations. Try a representative mix of model styles before adopting it across a project; heavily templated regions may not be checked. Minimal examples of cases that don't work well are welcome.
"""

