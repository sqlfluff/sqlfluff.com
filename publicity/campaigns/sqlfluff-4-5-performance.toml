SQLFluff 4.5 makes layout linting faster by removing repeated searches and sharing work between rules.

That matters most when layout checks account for much of your linting time, such as queries with wide SELECT lists or many CTEs. The release also reduces per-file setup and worker communication overhead.

Our three public fixture samples took 21–35% less total lint time with one process compared with 4.4.0. The post includes the chart, method and limitations, plus guidance on what to expect on your project.

https://sqlfluff.com/updates/sqlfluff-4-5-performance/
"""

