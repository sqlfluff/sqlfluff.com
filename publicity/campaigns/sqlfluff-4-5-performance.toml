linkedin = """
SQL linting should fit into your development workflow without keeping you waiting.

SQLFluff 4.5.0 includes performance improvements across layout rules, per-file setup and parallel processing, alongside improvements to the optional Rust engine.

In our three public fixture samples, median single-process lint time fell by 21–35% compared with 4.4.0. These small-batch measurements use the Python parser; they are not a prediction for every project.

Our update includes the chart, reproducible data and guidance on where to expect the most visible difference.

Read more: https://sqlfluff.com/updates/sqlfluff-4-5-performance/

Thank you to everyone who contributed and reviewed the work.
"""

