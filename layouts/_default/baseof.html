<!doctype html>
<html lang="{{ .Site.Language.LanguageCode | default "en" }}">

    <a class="sqlfluff-skip-link" href="#main-content">Skip to content</a>
    {{ partial "header.html" . }}

    </main>
    {{ partial "footer.html" . }}
  </body>
</html>
