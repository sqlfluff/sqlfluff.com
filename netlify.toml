[build]
  # https://gohugo.io/hosting-and-deployment/hosting-on-netlify/
  # Recommended settings from docs
  # --gc means garbage collect
  # --minify mean it will minify any files that it can
  command = "hugo --gc --minify"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.125.4"
  TZ = "Europe/London"

[context.deploy-preview]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"

[context.deploy-preview.environment]
  HUGO_PARAMS_NOINDEX = "true"

[context.branch-deploy]
  command = "hugo --gc --minify --buildDrafts --buildFuture --baseURL $DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  HUGO_PARAMS_NOINDEX = "true"

[[redirects]]
  from = "/stats/*"
  to = "https://brilliant-naiad-526a97.netlify.app/:splat"
  status = 200
  force = true
